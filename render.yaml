services:
  # FastAPI Backend Service
  - type: web
    name: customer-support-agent-api
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt && python scripts/seed_database.py && python scripts/build_knowledge_index.py"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./support_agent.db
