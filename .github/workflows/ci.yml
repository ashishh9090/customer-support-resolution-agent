name: CI Test & Evaluation Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Database Migrations and Seed
      run: |
        PYTHONPATH=. alembic -c backend/alembic.ini upgrade head
        PYTHONPATH=. python scripts/seed_database.py
        PYTHONPATH=. python scripts/build_knowledge_index.py

    - name: Run Pytest Test Suite
      run: |
        PYTHONPATH=. pytest backend/tests/ -v

    - name: Run 32-Scenario Evaluation Benchmark
      run: |
        PYTHONPATH=. python evaluation/run_evaluation.py

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build
